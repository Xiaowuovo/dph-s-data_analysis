<!-- templates/about.html -->
{% extends "base.html" %}

{% block content %}
<div class="container mt-4">
    <h2>关于电商用户行为分析系统</h2>
    <div class="card">
        <div class="card-body">
            <h5 class="card-title">系统介绍</h5>
            <p class="card-text">这是一个基于Flask的电商用户行为分析系统，提供数据上传、分析、可视化等功能。</p>
            <h5 class="card-title">主要功能</h5>
            <ul>
                <li>用户行为数据上传与存储</li>
                <li>数据查询与分析</li>
                <li>用户行为模式识别</li>
                <li>RFM用户分群</li>
                <li>数据可视化展示</li>
            </ul>
        </div>
    </div>
</div>
{% endblock %}
